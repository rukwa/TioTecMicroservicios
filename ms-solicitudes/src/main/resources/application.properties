spring.application.name=ms-solicitudes
server.port=8082

# MySQL de Laragon o XAMPP (usuario root sin clave). La base se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/tiotec_solicitudes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# update: crea o ajusta la tabla a partir de la entidad sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
